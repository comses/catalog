# Shared services for all Compose environments (dev, staging, prod).
# Local development uses project `catalog`; hosts pass `-p comses-catalog`.
name: catalog
services:
  redis:
    image: redis:8.10.1@sha256:8a1efc5f479551822b47424ccae982026b633f28818eab0387348120a61e10e2
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.19.21@sha256:cbf5cd6cfe5532a9c02d510c66d238bf329cd51fe3d57170a2a880aca7d47419
    # Settings live here rather than in a bind-mounted file from the release
    # bundle, so a new release does not restart Elasticsearch.
    environment:
      - cluster.name=catalog-search
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms1g -Xmx1g"
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    cap_add:
      - IPC_LOCK
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      # a cold start on the hosts' volume took five minutes while PostgreSQL was restoring
      start_period: 600s
    volumes:
      # Never attach Elasticsearch 8 to the legacy ES6 data volume. Search data
      # is rebuilt from PostgreSQL into this separate volume.
      - esdata8:/usr/share/elasticsearch/data
  db:
    image: postgres:18@sha256:86c951e05bf56c93d95d397747fb8820ac76cc3bedb78f43abd83eedbe3666ae
    volumes:
      - pgdata:/var/lib/postgresql
    restart: always
    environment:
      POSTGRES_USER: catalog
      POSTGRES_PASSWORD_FILE: /run/secrets/catalog_db_password
      POSTGRES_DB: comses_catalog
    secrets:
      - catalog_db_password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U catalog -d comses_catalog"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
  django:
    volumes:
      - ${CATALOG_SHARED_DIR:-./docker/shared}:/shared
    environment:
      DJANGO_SETTINGS_MODULE: 'catalog.settings.prod'
      LANG: "C.UTF-8"
      DB_USER: catalog
      DB_HOST: db
      DB_NAME: comses_catalog
      DB_PORT: 5432
      ELASTICSEARCH_HOST: elasticsearch
    secrets:
      - catalog_django_config
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
volumes:
  pgdata:
    driver: local
  esdata8:
    driver: local
  static:
    driver: local

# File-based Compose secrets (replace the former external swarm secrets).
# The runtime path /run/secrets/<name> matches the secret name: the app
# reads /run/secrets/catalog_django_config (catalog/settings/base.py) and
# the Postgres entrypoint reads POSTGRES_PASSWORD_FILE
# (/run/secrets/catalog_db_password). The source files are generated by
# `make config-generate` locally or `make configure` on a host.
secrets:
  catalog_django_config:
    file: ${CATALOG_CONFIG_DIR:-./deploy/conf}/config.ini
  catalog_db_password:
    file: ${CATALOG_CONFIG_DIR:-./deploy/conf}/postgres_password
