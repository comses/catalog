worker_processes 1;
user        root;
pid         /catalog/nginx.pid;
# Logs go to the container's streams; the host's Docker logging policy owns
# collection and rotation.
error_log   /dev/stderr;

events {
    worker_connections 1024;
    accept_mutex off;
}

http {
    include mime.types;
    default_type application/octet-stream;
    access_log  /dev/stdout combined;
    sendfile on;
    keepalive_timeout 65;

    upstream app_server {
        server unix:/catalog/socket/gunicorn.sock fail_timeout=0;
    }

    # Staging serves a copy of production data, so keep crawlers out.
    map $host $catalog_disallow_robots {
        staging-catalog.comses.net 1;
        default 0;
    }

    server {
        listen      80;
        client_max_body_size    75M;
        server_name catalog.comses.net;

        root /catalog/static;

        location /static {
            alias /catalog/static;
        }

        location = /robots.txt {
            default_type text/plain;
            if ($catalog_disallow_robots) {
                return 200 "User-agent: *\nDisallow: /\n";
            }
            alias /catalog/static/robots.txt;
        }

        # the container healthcheck; answered by nginx itself so no request reaches the application
        location = /healthz {
            access_log off;
            return 204;
        }

        location /favicon.ico {
            alias /catalog/static/favicon.ico;
        }

        location / {
            # check for static files first, otherwise proxy to app
            try_files $uri @proxy_to_app;
        }
        location @proxy_to_app {
            # HTTP proxy to the Gunicorn unix socket (replaces the legacy
            # uWSGI protocol).
            proxy_pass http://app_server;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            # HAProxy terminates TLS in front of this server. The legacy
            # uWSGI setup hard-coded https (UWSGI_SCHEME); Gunicorn maps
            # X-Forwarded-Proto to wsgi.url_scheme for trusted unix-socket
            # peers, so keep the same hard-coded value here.
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;
            proxy_redirect  off;
            proxy_buffering off;
        }
    }
}

