; DEPRECATED - uWSGI has been removed from the catalog deployment.
;
; This file used to configure uWSGI (socket /catalog/socket/uwsgi.sock,
; module catalog.wsgi). The app now runs under Gunicorn 26.2.0, started by
; deploy/docker/prod.sh and bound to unix:/catalog/socket/gunicorn.sock,
; proxied by Nginx over plain HTTP.
;
; The file is intentionally kept (content retired) only because
; staging.yml still lists it as a compose config source mounted into the
; django service at /code/deploy/uwsgi/catalog.ini. Nothing reads it at
; runtime. Once staging.yml is updated, this file and the deploy/uwsgi/
; directory can be deleted.
